<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0b1534" />
<title>Un regalo para ti ♡</title>
<meta property="og:title" content="Un regalo para ti ♡" />
<meta property="og:description" content="Ábrelo en tu laptop 💻" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Nunito:wght@600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 18px;
    font-family: "Nunito", sans-serif; color: #f4ecff; overflow-x: hidden;
    background:
      radial-gradient(60% 45% at 20% 10%, rgba(156, 110, 255, .28), transparent 70%),
      radial-gradient(55% 40% at 90% 85%, rgba(255, 120, 190, .22), transparent 70%),
      radial-gradient(50% 35% at 80% 20%, rgba(90, 200, 255, .14), transparent 70%),
      linear-gradient(180deg, #0b1534, #120f2e 60%, #0a0d22);
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  main {
    position: relative; z-index: 1; width: min(400px, 100%); text-align: center;
    padding: 34px 24px 26px; border-radius: 28px;
    background: rgba(20, 18, 50, .45); border: 1px solid rgba(255, 255, 255, .1);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
    animation: entra 1.1s cubic-bezier(.2, 1.1, .3, 1) both;
  }
  @keyframes entra { from { opacity: 0; transform: translateY(24px) scale(.96); } }
  .corazon { font-size: 46px; line-height: 1; filter: drop-shadow(0 0 18px rgba(255, 120, 190, .7)); animation: late 1.6s ease-in-out infinite; }
  @keyframes late { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.14); } 30% { transform: scale(1); } 45% { transform: scale(1.08); } }
  h1 { margin: 14px 0 6px; font-family: "Fraunces", serif; font-weight: 600; font-size: 30px; line-height: 1.15; }
  h1 em { font-style: italic; font-weight: 500; color: #ffb3d6; }
  .sub { margin: 0 0 22px; font-size: 15.5px; line-height: 1.5; color: #d6cdee; }
  .laptop {
    display: flex; align-items: center; gap: 12px; text-align: left; margin: 0 0 22px; padding: 13px 15px; border-radius: 16px;
    background: rgba(255, 255, 255, .07); font-size: 14px; line-height: 1.4; color: #e9e1ff;
  }
  .laptop b { color: #fff; }
  .laptop span { font-size: 28px; }
  .enlace {
    margin: 0 0 14px; padding: 12px 14px; border-radius: 14px; word-break: break-all;
    font: 700 13.5px/1.35 "Nunito", sans-serif; color: #ffd6ea;
    background: rgba(0, 0, 0, .28); border: 1px dashed rgba(255, 180, 220, .35);
    user-select: all; -webkit-user-select: all;
  }
  button, a.btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    margin: 0 0 10px; padding: 15px 18px; border: 0; border-radius: 999px; cursor: pointer; text-decoration: none;
    font: 800 15.5px "Nunito", sans-serif; transition: transform .2s, box-shadow .2s, background .3s;
    -webkit-tap-highlight-color: transparent;
  }
  button:active, a.btn:active { transform: scale(.97); }
  #copiar { color: #fff; background: linear-gradient(135deg, #f08bb4, #a873e8); box-shadow: 0 10px 28px rgba(200, 100, 200, .35); }
  #copiar.ok { background: linear-gradient(135deg, #6fd3a8, #4fb0c9); }
  #wsp { color: #fff; background: #25d366; box-shadow: 0 10px 28px rgba(37, 211, 102, .28); }
  #wsp svg { width: 20px; height: 20px; }
  .aqui { display: inline-block; margin-top: 8px; font-size: 13px; color: #b9addb; text-decoration: underline; text-underline-offset: 3px; }
  .firma { margin: 20px 0 0; font-family: "Caveat", cursive; font-size: 22px; color: #ffb3d6; }
</style>
</head>
<body>
  <canvas id="cielo" aria-hidden="true"></canvas>
  <main>
    <div class="corazon">💗</div>
    <h1>Hola, <em>Kiarita</em></h1>
    <p class="sub">Hay un pequeño escenario esperándote,<br />hecho con mucho cariño.</p>

    <div class="laptop">
      <span>💻</span>
      <div>Se disfruta <b>mucho mejor en una laptop</b>. Copia el enlace o envíatelo por WhatsApp para abrirlo allá.</div>
    </div>

    <p class="enlace" id="enlace"></p>
    <button id="copiar">📋 Copiar enlace</button>
    <a class="btn" id="wsp" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-2-1.2 7.4 7.4 0 0 1-1.4-1.7c-.1-.2 0-.4.1-.5l.4-.4.2-.4v-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a.9.9 0 0 0-.7.3 2.8 2.8 0 0 0-.9 2.1 4.9 4.9 0 0 0 1 2.6 11.2 11.2 0 0 0 4.3 3.8c1.6.7 2.2.7 3 .6a2.6 2.6 0 0 0 1.7-1.2 2.1 2.1 0 0 0 .2-1.2c-.1-.1-.2-.2-.4-.3Z"/></svg>
      Enviármelo por WhatsApp
    </a>
    <a class="aqui" id="aqui">o ábrelo aquí de todos modos</a>
    <p class="firma">Con cariño ♡</p>
  </main>

<script>
  // ✏️ Pega aquí el enlace del escenario cuando ya esté publicado
  const ENLACE = 'https://nornem.github.io/regalo-para-ti/';
  const url = ENLACE;
  if (url.includes('PEGA-AQUI')) document.querySelector('.sub').innerHTML = '(Falta pegar el enlace del escenario en este archivo ✏️)';
  document.getElementById('enlace').textContent = url;
  document.getElementById('aqui').href = url;
  document.getElementById('wsp').href =
    'https://wa.me/?text=' + encodeURIComponent('Ábrelo en tu laptop 💻♡\n' + url);

  const btn = document.getElementById('copiar');
  btn.addEventListener('click', async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(url); ok = true; } catch (e) {
      const t = document.createElement('textarea'); t.value = url; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
      t.remove();
    }
    btn.textContent = ok ? '✓ ¡Copiado! Pégalo en tu laptop' : 'Mantén presionado el enlace para copiarlo';
    btn.classList.toggle('ok', ok);
    setTimeout(() => { btn.textContent = '📋 Copiar enlace'; btn.classList.remove('ok'); }, 3200);
  });

  // cielo con estrellitas que titilan y se unen suavemente
  const cv = document.getElementById('cielo'), cx = cv.getContext('2d');
  let W, H, pts;
  const COL = ['255,150,200', '190,150,255', '140,190,255', '150,240,230'];
  function armar() {
    const d = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
    const n = Math.round(Math.min(70, W * H / 9000));
    pts = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .18, vy: (Math.random() - .5) * .18,
      r: .6 + Math.random() * 1.4, ph: Math.random() * 7, c: COL[Math.floor(Math.random() * COL.length)],
    }));
  }
  armar(); addEventListener('resize', armar);
  function cuadro(ms) {
    const t = ms / 1000;
    cx.clearRect(0, 0, W, H);
    for (const p of pts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10;
      if (p.y < -10) p.y = H + 10; if (p.y > H + 10) p.y = -10;
    }
    const D = 95;
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < D) { cx.strokeStyle = `rgba(${a.c},${(1 - d / D) * .22})`; cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke(); }
    }
    for (const p of pts) {
      const tw = .55 + .45 * Math.sin(t * 2 + p.ph);
      cx.fillStyle = `rgba(${p.c},${.5 + .5 * tw})`; cx.shadowColor = `rgba(${p.c},.9)`; cx.shadowBlur = 8;
      cx.beginPath(); cx.arc(p.x, p.y, p.r * (0.8 + tw * .5), 0, 7); cx.fill();
    }
    cx.shadowBlur = 0;
    requestAnimationFrame(cuadro);
  }
  requestAnimationFrame(cuadro);
</script>
</body>
</html>
